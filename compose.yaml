# Services de développement uniquement : Frigg lui-même tourne en binaire unique.
services:
  mailpit:
    # Capture les e-mails envoyés en local (SMTP :1025, interface web :8025).
    image: axllent/mailpit:v1.32.0
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    restart: unless-stopped
