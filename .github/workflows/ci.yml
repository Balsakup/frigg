# Rejoue les contrôles exigés avant fusion (go tool task check) sur chaque
# Pull Request et chaque push sur main. Les deux jobs sont des checks requis
# par le ruleset de main : garder leurs noms stables.
# Les actions tierces sont épinglées par SHA, comme dans release.yml.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BUN_VERSION: 1.4.4 # garder alignée sur l'image oven/bun du Dockerfile

jobs:
  checks:
    name: Contrôles
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Compile le binaire (CGO_ENABLED=0)
        run: go tool task build

      - name: go vet
        run: go vet ./...

      - name: Tests Go
        run: go test ./...

      # Même version que l'en-tête du code généré (internal/database/sqlc).
      - name: Installe sqlc
        run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1

      - name: Vérifie que le code généré est à jour
        run: |
          go tool task gen
          git diff --exit-code internal/database/sqlc web/app/api

      - name: Vérifie les types du frontend
        working-directory: web
        run: bun run typecheck

      - name: Lint du frontend
        working-directory: web
        run: bun run lint

      - name: Tests du frontend
        working-directory: web
        run: bun run test

  e2e:
    name: Tests de bout en bout
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mailpit:
        image: axllent/mailpit:v1.32.0 # garder alignée sur compose.yaml
        ports:
          - 1025:1025
          - 8025:8025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Compile le binaire
        run: go tool task build

      - name: Installe Chromium pour Playwright
        working-directory: web
        run: bunx playwright install --with-deps chromium

      - name: Tests de bout en bout
        working-directory: web
        run: bun run e2e
