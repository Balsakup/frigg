# Mises à jour hebdomadaires des dépendances de construction épinglées par
# empreinte (images du Dockerfile) ou par SHA (actions GitHub) : sans elles,
# les versions figées vieilliraient et l'analyse de vulnérabilités de la
# release finirait par bloquer toute publication (spec 007, research.md › R3).
# Les modules Go et les paquets du frontend sont aussi suivis chaque semaine.
# Penser à aligner BUN_VERSION de release.yml et ci.yml quand l'image oven/bun
# change.
version: 2
updates:
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "⬆️"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "⬆️"

  # Modules Go : mineures et correctifs regroupés, majeures en PR séparées.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "⬆️"
    groups:
      go:
        update-types: [minor, patch]
    # Sous-module sans étiquette (pseudo-version) : Dependabot lui attribue à
    # tort l'étiquette v1.4.1 du module parent et échoue. Mise à jour manuelle :
    # go get github.com/alexedwards/scs/sqlite3store@latest
    ignore:
      - dependency-name: github.com/alexedwards/scs/sqlite3store

  # Frontend : l'écosystème bun met à jour web/bun.lock (npm ne le ferait pas).
  - package-ecosystem: bun
    directory: /web
    schedule:
      interval: weekly
    commit-message:
      prefix: "⬆️"
    groups:
      web:
        update-types: [minor, patch]
    # TypeScript 7 (compilateur réécrit en Go) n'expose plus l'API JavaScript
    # (ts.factory) dont openapi-typescript a besoin pour gen:api. À lever
    # quand openapi-typescript le prendra en charge.
    ignore:
      - dependency-name: typescript
        versions: [">=7"]
