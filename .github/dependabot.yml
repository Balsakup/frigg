# Dependabot ne propose que les correctifs de failles (alertes de sécurité
# activées sur le dépôt) : open-pull-requests-limit: 0 coupe les mises à jour
# de version, les blocs restent pour que les correctifs de sécurité suivent
# les groupes, exclusions et préfixes définis ici. Les groupes portent
# applies-to: security-updates : sans cela, ils visent les mises à jour de
# version et Dependabot ouvre quand même des PR groupées malgré la limite à 0.
# Exception : les images du Dockerfile, épinglées par empreinte, ne reçoivent
# pas de correctifs de sécurité Dependabot. Elles restent mises à jour chaque
# mois, sans quoi l'analyse de vulnérabilités de la release finirait par
# bloquer toute publication (spec 007, research.md › R3).
# Penser à aligner BUN_VERSION de release.yml et ci.yml quand l'image oven/bun
# change.
version: 2
updates:
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "⬆️"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: "⬆️"

  # Modules Go : correctifs de sécurité mineurs et patchs regroupés, majeurs en
  # PR séparées.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: "⬆️"
    groups:
      go:
        applies-to: security-updates
        update-types: [minor, patch]
    # Sous-module sans étiquette (pseudo-version) : Dependabot lui attribue à
    # tort l'étiquette v1.4.1 du module parent et échoue. Mise à jour manuelle :
    # go get github.com/alexedwards/scs/sqlite3store@latest
    ignore:
      - dependency-name: github.com/alexedwards/scs/sqlite3store

  # Frontend : l'écosystème bun met à jour web/bun.lock (npm ne le ferait pas).
  - package-ecosystem: bun
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: "⬆️"
    groups:
      web:
        applies-to: security-updates
        update-types: [minor, patch]
    # TypeScript 7 (compilateur réécrit en Go) n'expose plus l'API JavaScript
    # (ts.factory) dont openapi-typescript a besoin pour gen:api. À lever
    # quand openapi-typescript le prendra en charge.
    ignore:
      - dependency-name: typescript
        versions: [">=7"]
